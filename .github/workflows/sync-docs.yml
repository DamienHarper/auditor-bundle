name: Sync docs to auditor-docs

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to sync (e.g. 7.1.0)'
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout auditor-bundle
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Checkout auditor-docs
        uses: actions/checkout@v6
        with:
          repository: DamienHarper/auditor-docs
          path: auditor-docs
          token: ${{ secrets.AUDITOR_DOCS_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: auditor-docs/package-lock.json

      - name: Install auditor-docs dependencies
        run: npm ci
        working-directory: auditor-docs

      - name: Compute versions
        id: versions
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSIONS_FILE: ./auditor-docs/auditor-bundle_versions.json
        run: |
          MAJOR=$(echo "$TAG" | cut -d. -f1)
          MINOR=$(echo "$TAG" | cut -d. -f2)
          PATCH=$(echo "$TAG" | cut -d. -f3)
          is_frozen() {
            node -e "process.exit(require(process.argv[1]).includes(process.argv[2]) ? 0 : 1)" "$VERSIONS_FILE" "$1"
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # A tag of an already frozen major comes from a maintenance branch: syncing it would
          # overwrite the published docs of the newer major.
          if is_frozen "${MAJOR}.x"; then
            echo "::notice::${MAJOR}.x docs are frozen in auditor-docs, tag $TAG is not synced."
            echo "sync=false" >> "$GITHUB_OUTPUT"
            echo "freeze=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sync=true" >> "$GITHUB_OUTPUT"
          # On a new major (X.0.0), the published docs are those of the previous major: freeze them
          # as (X-1).x before replacing them, unless that version is already frozen (re-run).
          FREEZE_LABEL="$((MAJOR - 1)).x"
          if [ "$MAJOR" -gt 1 ] && [ "$MINOR" -eq 0 ] && [ "$PATCH" -eq 0 ] && ! is_frozen "$FREEZE_LABEL"; then
            echo "freeze=true" >> "$GITHUB_OUTPUT"
            echo "freeze_label=$FREEZE_LABEL" >> "$GITHUB_OUTPUT"
          else
            echo "freeze=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Freeze the published major (on X.0.0 only)
        if: steps.versions.outputs.freeze == 'true'
        working-directory: auditor-docs
        env:
          FREEZE_LABEL: ${{ steps.versions.outputs.freeze_label }}
        run: npm run docusaurus -- docs:version:auditor-bundle "$FREEZE_LABEL"

      - name: Sync docs
        if: steps.versions.outputs.sync == 'true'
        run: |
          rm -rf auditor-docs/docs/auditor-bundle
          cp -r docs/ auditor-docs/docs/auditor-bundle

      - name: Inject Docusaurus front matter into index.md
        if: steps.versions.outputs.sync == 'true'
        run: |
          INDEX="auditor-docs/docs/auditor-bundle/index.md"
          if ! head -1 "$INDEX" | grep -q '^---'; then
            CONTENT=$(cat "$INDEX")
            printf -- '---\nid: index\ntitle: Introduction\nslug: /\n---\n\n%s' "$CONTENT" > "$INDEX"
          fi

      - name: Commit and push
        if: steps.versions.outputs.sync == 'true'
        env:
          TAG: ${{ steps.versions.outputs.tag }}
        run: |
          cd auditor-docs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: sync auditor-bundle docs from tag $TAG"
          git push
